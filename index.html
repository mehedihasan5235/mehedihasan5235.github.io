
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Login</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #071f25, #008080);
}

.login-box {
  width: 350px;
  padding: 40px 30px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  animation: appear 0.8s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  color: white;
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  color: #d5eeee;
  text-align: center;
  font-size: 13px;
  margin-bottom: 30px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: none;
  outline: none;
  border-radius: 9px;
  background: rgba(255,255,255,0.9);
  font-size: 14px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 9px;
  background: #00c6a7;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #00a98e;
  transform: translateY(-3px);
}

.footer {
  color: white;
  text-align: center;
  margin-top: 25px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Welcome Back!</h2>
  <p class="subtitle">Login to your account</p>

  <form id="loginForm">
    <input type="email" placeholder="Email Address" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>

  <p class="footer">© 2026 Premium Login</p>
</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Demo Login Successful!");
});
</script>

</body>
</html>
